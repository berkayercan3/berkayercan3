name: Profile metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 0"

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Validate metrics token
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "$METRICS_TOKEN" ]; then
            echo "METRICS_TOKEN is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Render light metrics
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics-light.svg
          output_action: none
          template: classic
          base: header, activity, community, repositories
          config_display: large
          config_timezone: Europe/Istanbul
          config_animations: no
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_sections: most-used
          repositories_forks: no
          extras_css: |
            svg { background: #fbfdfc !important; }

      - name: Render dark metrics
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics-dark.svg
          output_action: none
          template: classic
          base: header, activity, community, repositories
          config_display: large
          config_timezone: Europe/Istanbul
          config_animations: no
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_sections: most-used
          repositories_forks: no
          extras_css: |
            svg { background: #18211f !important; }
            text { fill: #ecf7f1 !important; }

      - name: Install rendered metrics
        run: |
          test -s /metrics_renders/metrics-light.svg
          test -s /metrics_renders/metrics-dark.svg
          cp /metrics_renders/metrics-light.svg assets/metrics-light.svg
          cp /metrics_renders/metrics-dark.svg assets/metrics-dark.svg

      - name: Commit updated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/metrics-light.svg assets/metrics-dark.svg
          if git diff --cached --quiet; then
            echo "Metrics are already current."
            exit 0
          fi
          git commit -m "Update profile metrics"
          git push origin HEAD:${{ github.ref_name }}
